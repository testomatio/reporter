name: Publish REPORTER
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci

      # build for all versions except 1.x.x
      - name: build
        run: npm run build
        if: startsWith(github.event.release.tag_name, '1.') == false

      - run: git config --global user.name "GitHub CD bot"
      - run: git config --global user.email "github-cd-bot@example.com"
      - run: npm version ${{ github.event.release.tag_name }} --no-git-tag-version --allow-same-version
      - name: Sync CLI wrapper version in repository
        run: |
          npm version ${{ github.event.release.tag_name }} --no-git-tag-version --allow-same-version
          npm run prepare:standalone
          npm install --package-lock-only
        working-directory: ./packages/reporter-cli
      - name: Commit release version updates
        run: |
          git add package.json package-lock.json packages/reporter-cli/package.json packages/reporter-cli/package-lock.json
          git diff --cached --quiet || git commit -m "${{ github.event.release.tag_name }}"

      - name: Determine npm tag
        id: npm_tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if echo "$TAG" | grep -qE "alpha|-alpha|\.a\."; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE "beta|-beta|\.b\."; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE "rc|-rc|\.rc\."; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: npm publish --provenance --tag ${{ steps.npm_tag.outputs.tag }}

      - name: update Chagelog.md with autogenerated release notes
        run: |
          echo "\n\n\n## Release ${{ github.event.release.tag_name }}\n\n" >> Changelog.md
          echo "${{ github.event.release.body }}" >> Changelog.md
        if: contains(github.event.release.tag_name, 'beta') == false

      - name: commit version to package.json (only for not beta release)
        run: git push
        if: contains(github.event.release.tag_name, 'beta') == false

  publish_cli:
    name: Publish REPORTER CLI wrapper
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
        working-directory: ./packages/reporter-cli
      - name: Sync wrapper version with release version
        run: |
          npm version ${{ github.event.release.tag_name }} --no-git-tag-version --allow-same-version
          npm run prepare:standalone
          npm install --package-lock-only
        working-directory: ./packages/reporter-cli
      - name: Determine npm tag
        id: npm_tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if echo "$TAG" | grep -qE "alpha|-alpha|\.a\."; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE "beta|-beta|\.b\."; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif echo "$TAG" | grep -qE "rc|-rc|\.rc\."; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Publish wrapper to npm
        run: npm publish --provenance --tag ${{ steps.npm_tag.outputs.tag }}
        working-directory: ./packages/reporter-cli
